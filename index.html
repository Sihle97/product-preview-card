<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <picture>
        <source
          class="product-image"
          media="(min-width: 641px)"
          srcset="./images/image-product-desktop.jpg"
        />
        <img
          class="product-image"
          src="./images/image-product-mobile.jpg"
          alt=""
        />
      </picture>

      <div class="product-info">
        <h1 class="grey-font">Perfume</h1>

        <h2>
          Gabrielle Essence Eau De
          <span class="product-descriptor">Parfum</span>
        </h2>

        <p class="grey-font">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <span class="price">
          <h3 class="green-font">$149.99</h3>
          <h3 class="grey-font discounted-price">$169.99</h3>
        </span>

        <button>
          <img src="./images/icon-cart.svg" alt="cart icon" /> Add to Cart
        </button>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Sihle Sithole</a>.
    </footer>
  </body>
</html>
